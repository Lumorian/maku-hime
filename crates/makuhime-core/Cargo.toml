[package]
name = "makuhime-core"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
brotli = "9.1.0"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
flate2 = "1.1.10"
futures-util = "0.3.34"
hmac = "0.12"
md-5 = "0.10"
sha2 = "0.10"
url = "2"
tokio-util = "0.7"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "brotli", "stream", "form", "multipart", "charset", "http2"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "fs", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.1.8"
tracing = "0.1.44"
urlencoding = "2.1.3"
uuid = { version = "1.29.0", features = ["v4"] }
